<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f1ead9; font-family: "DM Sans", sans-serif; padding: 20px; display: flex; flex-direction: row; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .label { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5f6d79; }
  .btn { display: inline-block; border: none; cursor: pointer; font: inherit; }
</style>
</head>
<body>
  <div class="group">
    <div class="label">Primary</div>
    <button class="btn" style="padding:0.95rem 1.4rem; color:#f8fffd; background:linear-gradient(135deg,#0a5c55,#0d8a7c); border-radius:999px; border:none; font-weight:600; font-size:0.95rem; box-shadow:0 12px 22px rgba(10,92,85,0.22);">Create Ticket</button>
  </div>
  <div class="group">
    <div class="label">Ghost</div>
    <button class="btn" style="padding:0.8rem 1.1rem; color:#14212c; background:rgba(255,255,255,0.75); border:1px solid rgba(24,34,47,0.12); border-radius:999px; font-size:0.95rem;">Add Sample Request</button>
  </div>
  <div class="group">
    <div class="label">Stage action</div>
    <button class="btn" style="padding:0.8rem 1.1rem; color:#14212c; background:rgba(255,255,255,0.75); border:1px solid rgba(24,34,47,0.12); border-radius:999px; font-size:0.95rem;">Move Next →</button>
  </div>
  <div class="group">
    <div class="label">Nav button (dark)</div>
    <button class="btn" style="padding:0.9rem 1rem; color:#d9f0ee; background:rgba(255,255,255,0.14); border:none; border-radius:999px; font-size:0.95rem; text-align:left; min-width:140px;">Issue Channel</button>
  </div>
  <div class="group">
    <div class="label">Nav (inactive)</div>
    <button class="btn" style="padding:0.9rem 1rem; color:#d9f0ee; background:rgba(255,255,255,0.06); border:none; border-radius:999px; font-size:0.95rem; text-align:left; min-width:140px;">Kanban Board</button>
  </div>
</body>
</html>
