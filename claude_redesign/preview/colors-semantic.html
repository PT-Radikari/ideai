<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f1ead9; font-family: "DM Sans", sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 80px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 52px; border-radius: 14px; }
  .label { font-size: 10px; font-weight: 600; color: #5f6d79; line-height: 1.3; }
  .val { font-size: 9px; color: #8a9299; font-family: monospace; }
  .section-title { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5f6d79; }
  .badge-row { display: flex; gap: 8px; align-items: center; }
  .badge { padding: 5px 13px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; }
</style>
</head>
<body>
  <div class="section-title">Priority / Status</div>
  <div class="row" style="margin-bottom:8px;">
    <div class="swatch"><div class="chip" style="background:#a61b1b;"></div><div class="label">high</div><div class="val">#a61b1b</div></div>
    <div class="swatch"><div class="chip" style="background:#b56a0f;"></div><div class="label">medium</div><div class="val">#b56a0f</div></div>
    <div class="swatch"><div class="chip" style="background:#1f63d8;"></div><div class="label">low</div><div class="val">#1f63d8</div></div>
    <div class="swatch"><div class="chip" style="background:#b45309;"></div><div class="label">warning</div><div class="val">#b45309</div></div>
  </div>
  <div class="section-title">As Badges</div>
  <div class="badge-row">
    <span class="badge" style="background:#a61b1b;">High</span>
    <span class="badge" style="background:#b56a0f;">Medium</span>
    <span class="badge" style="background:#1f63d8;">Low</span>
  </div>
  <div class="section-title" style="margin-top:10px;">Brand Sigil Gradient</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#f4bf66;"></div><div class="label">sigil-start</div><div class="val">#f4bf66</div></div>
    <div class="swatch"><div class="chip" style="background:#6fe5cb;"></div><div class="label">sigil-end</div><div class="val">#6fe5cb</div></div>
    <div class="swatch"><div class="chip" style="background:linear-gradient(135deg,#f4bf66,#6fe5cb);"></div><div class="label">gradient</div><div class="val">gold → teal</div></div>
  </div>
</body>
</html>
