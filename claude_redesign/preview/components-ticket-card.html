<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f1ead9; font-family: "DM Sans", sans-serif; padding: 20px; }
  .card {
    padding: 1rem; text-align: left;
    border: 1px solid rgba(20,33,44,0.08); border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(248,242,233,0.88));
    box-shadow: 0 12px 30px rgba(20,33,44,0.08);
    max-width: 280px;
  }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .code { display: inline-flex; padding: 0.28rem 0.65rem; border-radius: 999px; font-size: 0.78rem; font-weight: 700; background: rgba(13,138,124,0.12); color: #0a5c55; }
  .badge { padding: 0.28rem 0.65rem; border-radius: 999px; font-size: 0.78rem; font-weight: 700; color: #fff; background: #a61b1b; }
  .title { font-family: "Libre Baskerville", serif; font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; color: #14212c; margin: 0 0 4px; }
  .sub { font-size: 0.9rem; color: #5f6d79; margin: 0 0 6px; }
  .summary { font-size: 0.9rem; line-height: 1.5; color: #14212c; margin: 0 0 10px; }
  .footer { display: flex; justify-content: space-between; font-size: 0.9rem; color: #5f6d79; }
</style>
</head>
<body>
  <div class="card">
    <div class="meta">
      <span class="code">OPS-0023</span>
      <span class="badge">High</span>
    </div>
    <h4 class="title">Automate payroll reconciliation for BPO</h4>
    <p class="sub">BPO Operations • Payroll</p>
    <p class="summary">Replace the 6-hour manual spreadsheet merge with an automated…</p>
    <div class="footer">
      <span>Sari Dewi</span>
      <span>2 attachments</span>
    </div>
  </div>
</body>
</html>
