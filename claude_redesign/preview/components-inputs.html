<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f1ead9; font-family: "DM Sans", sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 320px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; font-weight: 600; color: #14212c; }
  input, select, textarea {
    width: 100%; padding: 0.9rem 1rem; color: #14212c;
    border: 1px solid rgba(20,33,44,0.14); border-radius: 16px;
    background: rgba(255,255,255,0.9); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
    font: inherit; font-size: 0.92rem;
  }
  input:focus, select:focus { outline: 2px solid rgba(15,118,110,0.22); border-color: #0d8a7c; }
  .label { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5f6d79; }
</style>
</head>
<body>
  <div class="label">Form inputs</div>
  <label>Ticket title<input type="text" placeholder="Reduce manual reconciliation for BPO payroll"></label>
  <label>Priority
    <select>
      <option>High</option>
      <option selected>Medium</option>
      <option>Low</option>
    </select>
  </label>
  <label>Current manual process
    <textarea rows="3" placeholder="Describe the current workflow, handoffs, spreadsheets, approvals, and bottlenecks."></textarea>
  </label>
</body>
</html>
