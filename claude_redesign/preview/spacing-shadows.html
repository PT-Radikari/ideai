<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: "DM Sans", sans-serif; background: #e8e1d1; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5f6d79; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .box { width: 100px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #14212c; }
</style>
</head>
<body>
  <div class="label">Shadow system</div>
  <div class="row">
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
      <div class="box" style="background:rgba(255,252,247,0.95); box-shadow:0 28px 70px rgba(20,33,44,0.13);"></div>
      <div class="label">shadow (panels)</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
      <div class="box" style="background:rgba(255,252,247,0.95); box-shadow:0 16px 38px rgba(20,33,44,0.08);"></div>
      <div class="label">shadow-soft</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
      <div class="box" style="background:rgba(255,252,247,0.95); box-shadow:0 12px 30px rgba(20,33,44,0.08);"></div>
      <div class="label">shadow-card</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
      <div class="box" style="background:rgba(255,255,255,0.95); box-shadow:0 18px 36px rgba(20,33,44,0.10); border:1px solid rgba(13,138,124,0.2);"></div>
      <div class="label">shadow-hover</div>
    </div>
  </div>
  <div class="label" style="margin-top:4px;">Backdrop blur panels</div>
  <div class="row">
    <div style="position:relative;width:180px;height:72px;border-radius:18px;overflow:hidden;">
      <div style="position:absolute;inset:0;background:linear-gradient(135deg,#0d8a7c33,#df6f2d22);"></div>
      <div style="position:absolute;inset:8px;border-radius:12px;background:rgba(250,246,238,0.78);backdrop-filter:blur(12px);border:1px solid rgba(20,33,44,0.12);display:flex;align-items:center;justify-content:center;font-size:11px;color:#14212c;">panel — blur 12px</div>
    </div>
    <div style="position:relative;width:180px;height:72px;border-radius:18px;overflow:hidden;">
      <div style="position:absolute;inset:0;background:linear-gradient(135deg,#0f1b24,#083539);"></div>
      <div style="position:absolute;inset:8px;border-radius:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:11px;color:#d9f0ee;">panel-dark</div>
    </div>
  </div>
</body>
</html>
