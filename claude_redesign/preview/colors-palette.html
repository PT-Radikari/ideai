<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f1ead9; font-family: "DM Sans", sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 80px; display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 52px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.07); }
  .label { font-size: 10px; font-weight: 600; color: #5f6d79; line-height: 1.3; }
  .val { font-size: 9px; color: #8a9299; font-family: monospace; }
  .section-title { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5f6d79; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="section-title">Backgrounds</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#f1ead9; border:1px solid #ddd4c0;"></div><div class="label">bg</div><div class="val">#f1ead9</div></div>
    <div class="swatch"><div class="chip" style="background:#0f1b24;"></div><div class="label">bg-deep</div><div class="val">#0f1b24</div></div>
    <div class="swatch"><div class="chip" style="background:#0b252f;"></div><div class="label">bg-sidebar</div><div class="val">#0b252f</div></div>
    <div class="swatch"><div class="chip" style="background:rgba(250,246,238,0.78); backdrop-filter:blur(8px);"></div><div class="label">panel</div><div class="val">rgba translucent</div></div>
  </div>
  <div class="section-title" style="margin-top:6px;">Text</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#14212c;"></div><div class="label">ink</div><div class="val">#14212c</div></div>
    <div class="swatch"><div class="chip" style="background:#5f6d79;"></div><div class="label">muted</div><div class="val">#5f6d79</div></div>
  </div>
  <div class="section-title" style="margin-top:6px;">Accents</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#0d8a7c;"></div><div class="label">accent</div><div class="val">#0d8a7c</div></div>
    <div class="swatch"><div class="chip" style="background:#0a5c55;"></div><div class="label">accent-strong</div><div class="val">#0a5c55</div></div>
    <div class="swatch"><div class="chip" style="background:rgba(13,138,124,0.12); border:1px solid rgba(13,138,124,0.25);"></div><div class="label">accent-soft</div><div class="val">rgba tint</div></div>
    <div class="swatch"><div class="chip" style="background:#df6f2d;"></div><div class="label">signal</div><div class="val">#df6f2d</div></div>
    <div class="swatch"><div class="chip" style="background:rgba(223,111,45,0.14); border:1px solid rgba(223,111,45,0.25);"></div><div class="label">signal-soft</div><div class="val">rgba tint</div></div>
  </div>
</body>
</html>
