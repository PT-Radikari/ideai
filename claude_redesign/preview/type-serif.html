<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f1ead9; font-family: "Libre Baskerville", Georgia, serif; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid rgba(20,33,44,0.1); padding-bottom: 12px; }
  .label { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5f6d79; font-family: "DM Sans", sans-serif; }
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="row">
    <div class="label">Display / h1</div>
    <div style="font-size: clamp(2rem,3vw,2.5rem); font-weight:700; letter-spacing:-0.02em; line-height:1.2; color:#14212c;">Optimization Intake Board</div>
  </div>
  <div class="row">
    <div class="label">h2</div>
    <div style="font-size:2rem; font-weight:700; letter-spacing:-0.02em; line-height:1.25; color:#14212c;">Delivery runway</div>
  </div>
  <div class="row">
    <div class="label">h3 Panel heading</div>
    <div style="font-size:1.5rem; font-weight:700; letter-spacing:-0.02em; color:#14212c;">Create an optimization request</div>
  </div>
  <div class="row" style="border:none; padding-bottom:0;">
    <div class="label">h4 Card title</div>
    <div style="font-size:1.25rem; font-weight:700; letter-spacing:-0.02em; color:#14212c;">Issue Channel</div>
  </div>
</body>
</html>
